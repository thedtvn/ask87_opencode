name: Native release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag
        required: true
        default: native-v0.1.0-multi
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, platform: win32-x64, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, platform: win32-arm64, target: aarch64-pc-windows-msvc }
          - { runner: ubuntu-24.04, platform: linux-x64-gnu, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64-gnu, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15-intel, platform: darwin-x64, target: x86_64-apple-darwin }
          - { runner: macos-15, platform: darwin-arm64, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: thedtvn/attack_shark_x87_rs
          ref: 3d489cd0c71fb30e6f1729c213963c644e287fa1
          path: native-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux HID dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev
      - name: Install upstream dependencies without lifecycle scripts
        working-directory: native-source
        run: npm install --ignore-scripts
      - name: Build upstream native binding
        working-directory: native-source
        run: npm run build
      - name: Stage, scan, and load-test
        shell: bash
        run: |
          node scripts/package-native.mjs native-source stage "${{ matrix.platform }}"
          node -e "const n=require('./stage/native/${{ matrix.platform }}/ask87.node'); if(typeof n.version!=='function'||typeof n.connectionStatus!=='function') throw new Error('Native API unavailable'); console.log(n.version())"
      - uses: actions/upload-artifact@v4
        with:
          name: ask87-native-${{ matrix.platform }}
          path: stage/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          for platform in win32-x64 win32-arm64 linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64; do
            directory="artifacts/ask87-native-${platform}"
            test -f "${directory}/native/${platform}/ask87.node"
            test -f "${directory}/SOURCE-${platform}.json"
            cp "${directory}/native/${platform}/ask87.node" "release/ask87-${platform}.node"
            cp "${directory}/SOURCE-${platform}.json" "release/SOURCE-${platform}.json"
          done
          cd release
          sha256sum ask87-*.node SOURCE-*.json > SHA256SUMS
      - name: Create release without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists"
            exit 1
          fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "Native bindings $TAG" --notes "Native bindings from attack_shark_x87_rs commit 3d489cd0c71fb30e6f1729c213963c644e287fa1."
